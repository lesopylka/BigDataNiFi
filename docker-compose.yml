services:
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["127.0.0.1:5435:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/01_start.sql:/docker-entrypoint-initdb.d/01_start.sql:ro
      - ./sql/02_views.sql:/docker-entrypoint-initdb.d/02_views.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 30
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes: ["kafka_data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      retries: 30
  topic:
    image: confluentinc/cp-kafka:7.7.1
    command: kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic sales --partitions 1 --replication-factor 1
    depends_on:
      kafka: {condition: service_healthy}
  producer:
    build:
      context: .
      dockerfile: Dockerfile.tools
    command: python Scripts/produce.py
    profiles: ["send"]
    depends_on:
      topic: {condition: service_completed_successfully}
  nifi:
    build:
      context: .
      dockerfile: Dockerfile.nifi
    ports: ["127.0.0.1:8082:8080"]
    environment:
      NIFI_WEB_HTTP_PORT: 8080
      NIFI_WEB_HTTP_HOST: 0.0.0.0
      NIFI_WEB_HTTPS_PORT: ""
      NIFI_SENSITIVE_PROPS_KEY: lab-nifi-sensitive-key
      NIFI_JVM_HEAP_INIT: 512m
      NIFI_JVM_HEAP_MAX: 1g
    volumes:
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_state:/opt/nifi/nifi-current/state
      - nifi_database:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content:/opt/nifi/nifi-current/content_repository
      - nifi_provenance:/opt/nifi/nifi-current/provenance_repository
    depends_on:
      postgres: {condition: service_healthy}
      topic: {condition: service_completed_successfully}
  setup:
    build:
      context: .
      dockerfile: Dockerfile.tools
    command: python Scripts/setup_nifi.py
    depends_on: [nifi]
  metabase:
    image: metabase/metabase:v0.51.4
    ports: ["127.0.0.1:3000:3000"]
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes: ["metabase_data:/metabase-data"]
    depends_on:
      postgres: {condition: service_healthy}
  dashboards:
    build:
      context: .
      dockerfile: Dockerfile.tools
    command: python Scripts/setup_metabase.py
    profiles: ["dashboards"]
    environment:
      MB_EMAIL: ${MB_EMAIL:-alina@example.com}
      MB_PASSWORD: ${MB_PASSWORD:?Set MB_PASSWORD in .env before running compose}
    depends_on: [metabase]
volumes:
  postgres_data:
  kafka_data:
  nifi_conf:
  nifi_state:
  nifi_database:
  nifi_flowfile:
  nifi_content:
  nifi_provenance:
  metabase_data:
